# Vhost nginx para TU-DOMINIO → hub de apk-server (127.0.0.1:3130).
#
# Instalar:
#   sudo cp nginx-hub.conf /etc/nginx/sites-available/TU-DOMINIO
#   sudo sed -i 's/TU-DOMINIO/apk.ejemplo.com/g' /etc/nginx/sites-available/TU-DOMINIO
#   sudo ln -s /etc/nginx/sites-available/TU-DOMINIO /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d TU-DOMINIO
#
# Requisito previo: DNS A de TU-DOMINIO → IP del servidor.

map $http_upgrade $connection_upgrade_apk {
    default upgrade;
    ''      close;
}

# La consulta de versión y la descarga son públicas: el freno está aquí, antes
# de que llegue al hub. Un equipo pregunta una vez por hora; 5/s por IP con
# ráfaga deja pasar a una oficina entera detrás de la misma IP.
limit_req_zone $binary_remote_addr zone=apk_publico:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=apk_conexiones:10m;

server {
    server_name TU-DOMINIO;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Publicar un APK: hasta el tope del hub (APK_MAX_APK_MB), sin guardarlo
    # entero en un temporal de nginx antes de pasarlo.
    location ~ ^/v1/apps/[^/]+/versiones$ {
        client_max_body_size 300m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://127.0.0.1:3130;
    }

    # Las apps instaladas viven colgadas del WebSocket. Sin esto, nginx las
    # corta cada minuto y reconectan sin parar.
    location = /v1/ws {
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade_apk;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        limit_conn apk_conexiones 300;
        proxy_pass http://127.0.0.1:3130;
    }

    location /archivos/ {
        limit_conn apk_conexiones 50;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:3130;
    }

    location / {
        limit_req zone=apk_publico burst=40 nodelay;
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:3130;
    }

    listen 80;
    listen [::]:80;
}
