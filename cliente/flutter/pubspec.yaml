name: apk_server_flutter
description: Auto-actualización de apps Flutter con apk-server — aviso por WebSocket, descarga en segundo plano, notificación de «lista» e instalación sin preguntar en Android 12+. Y el comando para publicar.
version: 0.2.0
repository: https://github.com/pedromateodesarrollo/apk-server
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  # El comando de publicar (bin/publicar.dart) y el lector de APK, en Dart
  # puro, en este mismo repositorio. La app no lo usa.
  apk_server:
    path: ../dart

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

executables:
  publicar:

# Plugin solo en Android: la biblioteca de cliente/android hace todo
# (android/build.gradle.kts compila sus fuentes). En otra plataforma el canal
# no existe y UpdateService no hace nada.
flutter:
  plugin:
    platforms:
      android:
        package: com.chalonasoft.apk_server
        pluginClass: ApkServerPlugin
